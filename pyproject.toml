[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-hll"
version = "0.1.0"
description = "Zero-dependency HyperLogLog distinct counting. ~1KB fixed memory, sketch merging."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = ["hyperloglog", "cardinality", "distinct-count", "probabilistic", "analytics", "no-deps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-hll"
Repository = "https://github.com/hussain-alsaibai/tiny-hll"
Issues = "https://github.com/hussain-alsaibai/tiny-hll/issues"
